syntax = "proto3";
package raft;
option go_package = "github.com/LIGHT-YAGAMI-61/raftkv/proto";

service ChaosControl {
  rpc SetPartition(PartitionArgs) returns (ChaosAck);
  rpc SetDelay(DelayArgs) returns (ChaosAck);
  rpc GetStatus(StatusRequest) returns (StatusReply);
}

message PartitionArgs { repeated string blocked_peer_ids = 1; }
message DelayArgs { int64 delay_ms = 1; }
message ChaosAck {}
message StatusRequest {}

message StatusReply {
  string id = 1;
  string state = 2;
  uint64 term = 3;
  uint64 commit_index = 4;
  string known_leader_id = 5;
  uint64 last_log_index = 6;
}