syntax = "proto3";
package kv;
option go_package = "raftkv/proto";

service KV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message GetRequest    { string key = 1; }
message GetResponse   { bool ok = 1; string value = 2; string leader_hint = 3; }
message PutRequest    { string key = 1; string value = 2; }
message PutResponse   { bool ok = 1; string leader_hint = 2; }
message DeleteRequest { string key = 1; }
message DeleteResponse{ bool ok = 1; string leader_hint = 2; }